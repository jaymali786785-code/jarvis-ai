name: Build Jarvis APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - name: Create Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name jarvis_ai
          cat android/app/build.gradle | head -30
      - name: Fix compileSdk
        run: |
          sed -i "s/compileSdkVersion .*/compileSdkVersion 34/" android/app/build.gradle || true
          sed -i "s/compileSdk .*/compileSdk 34/" android/app/build.gradle || true
          grep -n "compileSdk" android/app/build.gradle || true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
