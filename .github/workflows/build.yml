name: Build Jarvis APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - run: flutter config --no-analytics
      - run: flutter create . --platforms=android --project-name jarvis_ai
      - run: |
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.22'/" android/build.gradle || true
          echo "ndkVersion = \"27.0.120\" " >> android/local.properties || true
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: build/app/outputs/flutter-apk/app-release.apk
