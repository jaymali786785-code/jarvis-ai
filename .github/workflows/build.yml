name: Build Jarvis APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
      - name: Create Android
        run: rm -rf android && flutter create . --platforms=android --project-name jarvis_ai --org com.jarvis
      - name: Fix minSdkVersion
        run: |
          sed -i "s/minSdkVersion .*/minSdkVersion 21/" android/app/build.gradle
          sed -i "s/minSdk .*/minSdk 21/" android/app/build.gradle
          grep -n "minSdk" android/app/build.gradle
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
