name: Build Jarvis APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - name: Recreate Android
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name jarvis_ai --org com.jarvis
          ls android/app/build.gradle
      - run: flutter pub get
      - name: Build Debug
        run: flutter build apk --debug -v
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
