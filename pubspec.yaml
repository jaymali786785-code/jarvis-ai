name: jarvis_ai
description: Jarvis - personal AI assistant (liquid glass UI, voice, memory, code studio)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  http: ^1.2.1
  geolocator: ^11.0.0
  webview_flutter: ^4.8.0
  android_intent_plus: ^5.0.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
